[workspace]
resolver = "3"
members = [
    "apps/agent",
    "crates/herald-core",
    "crates/herald-provider",
    "crates/herald-runtime",
    "crates/herald-storage",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["Herald contributors"]
license = "AGPL-3.0-or-later"
repository = "https://github.com/OWNER/herald"

[workspace.dependencies]
herald-core = { path = "crates/herald-core" }
herald-provider = { path = "crates/herald-provider" }
herald-runtime = { path = "crates/herald-runtime" }
herald-storage = { path = "crates/herald-storage" }

async-trait = "0.1"
clap = { version = "4", features = ["derive"] }
directories = "6"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["macros", "process", "rt-multi-thread", "sync", "time"] }
uuid = { version = "1", features = ["v4", "serde"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
