<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="herald-mascot-title herald-mascot-desc">
  <title id="herald-mascot-title">Herald, the messenger owl</title>
  <desc id="herald-mascot-desc">A geometric amber owl with a cream face, dark eyes, and a small cream envelope held at its chest. The owl is Herald's mascot: it watches the inbox, and it carries the message only after you approve it.</desc>

  <g>
